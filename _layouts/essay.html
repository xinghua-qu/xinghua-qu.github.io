---
layout: blog
---
<article class="essay" aria-labelledby="essay-title">
  <header class="essay__header">
    <p class="blog-eyebrow">Essay</p>
    <h1 id="essay-title">{{ page.title | escape }}</h1>
    <div class="essay__meta">
      <time class="blog-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time>
    </div>
  </header>
  <div class="essay__body">
    {{ content }}
  </div>
</article>
