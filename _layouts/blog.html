---
layout: compress
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}{% unless page.title == 'Blog' %} · Blog{% endunless %}</title>
    <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: page.excerpt | strip_html | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="Blog">
    <meta property="og:locale" content="en_US">
    <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
    {% if page.date %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">{% endif %}
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  </head>
  <body class="blog-site">
    <a class="blog-skip-link" href="#main">Skip to content</a>
    <header class="blog-masthead">
      <a class="blog-home" href="{{ '/' | relative_url }}"><span aria-hidden="true">←</span> Home</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>Blog</a>
      </nav>
    </header>
    <main id="main" class="blog-main">
      {{ content }}
    </main>
    <footer class="blog-footer">
      <a href="{{ '/blog/' | relative_url }}">All posts</a>
      <a href="{{ '/' | relative_url }}">Back to home <span aria-hidden="true">↗</span></a>
    </footer>
  </body>
</html>
